name: c01-baseline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select actual source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$(git branch --show-current)" != "$SOURCE_BRANCH" ]; then
            git switch -c "$SOURCE_BRANCH"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: pytest
      - run: bash scripts/check_secrets.sh
      - run: python scripts/harness_consistency_check.py
      - name: Verify maintenance squash integration
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin main
          python scripts/check_maintenance_integration.py --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$SOURCE_BRANCH"
